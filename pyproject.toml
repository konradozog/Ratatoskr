[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ratatoskr"
version = "0.1.0"
description = "Lightweight voice-to-clipboard tool — record, transcribe, paste"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Konrad Ozog" }]
keywords = ["voice", "transcription", "whisper", "clipboard", "speech-to-text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "PySide6>=6.6.0",
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/konradozog/Ratatoskr"
Repository = "https://github.com/konradozog/Ratatoskr"
Issues = "https://github.com/konradozog/Ratatoskr/issues"

[project.scripts]
ratatoskr = "ratatoskr.main:main"

[tool.setuptools.packages.find]
include = ["ratatoskr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
